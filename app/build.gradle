plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.android.gms.oss-licenses-plugin'
}

def versionPropsFile = file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def buildNumber = (versionProps['BUILD_NUMBER'] ?: '0').toInteger()

// Инкрементим только при реальной сборке.
// Sync в Студии не запускает задачи, поэтому номер от него не растёт.
def isRealBuild = gradle.startParameter.taskNames.any { name ->
    def n = name.toLowerCase()
    n.contains('assemble') || n.contains('bundle') || n.contains('install')
}

if (isRealBuild) {
    buildNumber++
    versionProps['BUILD_NUMBER'] = buildNumber.toString()
    versionPropsFile.withOutputStream { versionProps.store(it, 'Auto-incremented on each build') }
}

android {
    compileSdk 34
    namespace "com.braffdev.steganofy"

    defaultConfig {
        applicationId "com.bazyak.parkamat17"
        minSdkVersion 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.$buildNumber"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Parkamat17-${variant.versionName}.apk"
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':lib-steganofy')
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'com.google.android.gms:play-services-oss-licenses:17.0.0'
    implementation 'org.apache.commons:commons-lang3:3.11'
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'io.insert-koin:koin-android:3.2.0'
}